name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Rules and data tests (no AstrBot needed)
        run: pytest -q --ignore=tests/test_main.py
      - name: Install AstrBot for entry-point tests
        run: pip install astrbot
      - name: Full test-suite
        run: pytest -q
